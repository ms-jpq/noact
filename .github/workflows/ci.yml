---
on:
  push:
    branches:
      - noact
  schedule:
    - cron: "0 0 * * *" # daily

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/checkout@v4

      - run: |-
          npm install

      - env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: npm run ci
